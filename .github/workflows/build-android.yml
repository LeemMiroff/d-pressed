name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Prepare Cordova project
        run: |
          mkdir -p www
          cp -R dist/. www/
          npx --yes cordova@13 platform add android@14.0.1 || true
          printf '{"type":"commonjs"}\n' > platforms/android/cordova/package.json
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: |
          cd platforms/android
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d-pressed-android-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
